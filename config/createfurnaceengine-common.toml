#Furnace Engine RPM when no heat sink is adjacent to the furnace
# Default: 40
# Range: 1 ~ 256
baseRpm = 40
#Furnace Engine stress capacity per RPM when no heat sink is present
# Default: 32
# Range: 1 ~ 1024
baseSuPerRpm = 32
#Blocks recognized as heat sinks. Any one of them touching the furnace is enough.
#An entry is either a block id, or a block tag written with a leading '#'.
#Example: ["minecraft:copper_block", "#c:storage_blocks/iron"]
#Ids from mods that are not installed are ignored. An empty list disables heat sinks.
heatSinkBlocks = ["minecraft:copper_block"]
#Furnace Engine RPM when at least one heat sink is adjacent to the furnace
# Default: 32
# Range: 1 ~ 256
heatSinkRpm = 32
#Furnace Engine stress capacity per RPM when a heat sink is present
# Default: 32
# Range: 1 ~ 1024
heatSinkSuPerRpm = 32
